name: FreshPlanet
description: >-
  FreshPlanet Inc. is a New York City based mobile game developer, headquartered
  at 200 Hudson St, New York, NY 10013, best known for the music trivia franchise
  SongPop. The studio builds free-to-play mobile entertainment titles for iOS and
  Android, combining licensed music catalogs, social multiplayer play, and live
  events. FreshPlanet is a portfolio company of Uncork Capital. As a consumer game
  studio it does not operate a public developer program or API: it exposes only a
  marketing site, player support via a Zendesk help center, and standard legal
  surfaces (Terms of Use and Privacy Policy). This profile captures the studio's
  real public web and legal footprint for the API Evangelist network; there is no
  OpenAPI, SDK, or agent surface to enrich because the company publishes none.
